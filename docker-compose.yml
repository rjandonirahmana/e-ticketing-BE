# docker-compose.yml — deploy produksi e-ticketing (Pulse)
#
# Menggantikan `docker run -p 3100:3000 ...` manual dengan deploy yang:
#   - restart otomatis saat crash/panic/OOM (restart: unless-stopped) — INI fix
#     utama "app sering down": tanpa ini, sekali proses mati dia diam sampai
#     di-restart manual.
#   - punya healthcheck /healthz (butuh HEALTHCHECK di Dockerfile).
#
# Jalankan:  docker compose up -d --build
# Log:       docker compose logs -f
#
# PENTING sebelum dipakai — samakan dengan setup `docker run` kamu sekarang:
#   1. Port UDP SFU 4000 HARUS dipublish untuk live streaming (media WebRTC).
#   2. SFU_PUBLIC_IP di .env WAJIB di-set ke IP publik VPS (bukan 0.0.0.0),
#      dan port 4000/udp dibuka di firewall VPS.
#   3. UPLOAD_TMP_DIR menunjuk ke volume disk (bukan tmpfs/RAM).

services:
  app:
    build: .
    image: pulse:latest
    container_name: e-ticketing
    restart: unless-stopped
    env_file: .env
    environment:
      # Default app sudah `e_ticketing=info`; set eksplisit di sini agar jelas.
      - RUST_LOG=e_ticketing=info,tower_http=info
      # Streaming upload di-tulis ke direktori ini — dipetakan ke volume disk
      # di bawah. WAJIB disk (bukan tmpfs) agar tak memakan RAM 4GB box.
      - UPLOAD_TMP_DIR=/var/tmp/e-ticketing-uploads
    ports:
      - "3100:3000"        # HTTP (SSR + REST + WS) — di belakang pingora
      - "4000:4000/udp"    # SFU WebRTC media (live streaming)
    volumes:
      - upload-tmp:/var/tmp/e-ticketing-uploads
    # OPSIONAL (aktifkan setelah tahu RSS normal app — cek `docker stats`).
    # Box 2 vCPU / 4 GB: membatasi memori membuat OOM-kill 1 container (lalu
    # auto-restart) alih-alih seluruh VPS thrashing. TAPI kalau limit di bawah
    # pemakaian normal, justru bikin restart-loop — jangan set membabi buta.
    # mem_limit: 2500m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  upload-tmp:
