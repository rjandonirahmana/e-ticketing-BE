# ═══════════════════════════════════════════════════════════════════════════════
# e-ticketing — Satu crate: Backend API (Axum) + Frontend CSR (Leptos)
# ═══════════════════════════════════════════════════════════════════════════════

[package]
name = "e-ticketing"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "e-ticketing"
path = "src/main.rs"

[lib]
name = "e_ticketing"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[package.metadata.leptos]
name = "e-ticketing"
output-name = "e-ticketing"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "styles/tokens.css"
assets-dir = "public"
site-addr = "0.0.0.0:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
lib-features = ["hydrate"]

# ── Features ───────────────────────────────────────────────────────────────────
[features]
default = ["ssr"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:urlencoding",
]
hydrate = ["leptos/hydrate"]

# ── Shared deps (dikompilasi untuk SEMUA target: native SSR + WASM) ────────────
# ATURAN: jangan taruh dep yang menarik tokio/mio/axum di sini.
# Semua server-only dep ada di [target.'cfg(not(target_arch="wasm32"))'.dependencies]
[dependencies]
# Serialization (dipakai CSR dan SSR)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling (shared)
thiserror = "2.0.18"
anyhow = "1"
once_cell = "1"
futures = { version = "0.3", features = ["std"] }

# Date/time (wasmbind agar chrono::Utc::now() bekerja di WASM)
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

# Leptos (shared SSR + hydrate)
leptos = { version = "0.8", default-features = false }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false }
leptos_axum = { version = "0.8", optional = true }
urlencoding = { version = "2", optional = true }

# WASM bridge (diperlukan juga saat SSR rlib untuk type compatibility)
send_wrapper = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# Browser APIs — fitur minimal untuk SSR rlib compilation CSR module
# (SSR tidak PAKAI ini, tapi CSR code butuh type defs saat dikompilasi sebagai rlib)
gloo-net = "0.6"
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
getrandom = "0.3"
qrcodegen = "1.8"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Event",
    "EventTarget",
    "MouseEvent",
    "KeyboardEvent",
    "TouchEvent",
    "TouchList",
    "Touch",
    "PointerEvent",
    "HtmlInputElement",
    "HtmlAnchorElement",
    "FormData",
    "File",
    "FileList",
    "FilePropertyBag",
    "HtmlCanvasElement",
    "HtmlVideoElement",
    "HtmlImageElement",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "TextMetrics",
    "Url",
    "UrlSearchParams",
    "WebSocket",
    "MessageEvent",
    "Blob",
    "Storage",
    "StorageEvent",
    "Navigator",
    "Clipboard",
    "Performance",
    "DomRect",
    "FontFaceSet",
    "AddEventListenerOptions",
    "Request",
    "RequestInit",
    "Response",
] }

# ── Server-only deps (TIDAK dikompilasi untuk wasm32) ─────────────────────────
# Semua dep yang menarik mio/tokio-net/native TLS ada di sini.
# Saat cargo leptos build WASM (target=wasm32), bagian ini DILEWATI sepenuhnya.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.18"

# gRPC
tonic = "0.14.6"
prost = "0.14.3"

# Web framework
axum = { version = "0.8.9", features = ["multipart", "ws", "macros"] }
tower = "0.5.3"
tower-http = { version = "0.6.10", features = ["cors", "trace", "fs"] }

# Database
tokio-postgres = { version = "0.7.9", features = [
    "with-uuid-1",
    "with-chrono-0_4",
    "with-serde_json-1",
] }
postgres-types = { version = "0.2.13", features = ["derive"] }
deadpool-postgres = "0.14.1"
redis = { version = "1.2.1", features = ["tokio-comp", "connection-manager"] }

# Auth / Security
jsonwebtoken = { version = "10.3.0", features = ["use_pem", "rust_crypto"] }
bcrypt = "0.19.1"
uuid = { version = "1", features = ["v4", "serde"] }

# HTTP client (server functions → API internal)
reqwest = { version = "0.12", features = ["json"] }

# Storage & TLS
aws-sdk-s3 = "1.132.0"
rustls = { version = "0.23", features = ["ring"], default-features = false }

# Config / Validation / Logging
dotenvy = "0.15"
config = "0.15.22"
validator = { version = "0.20", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc server utils
rand = "0.10.1"
hex = "0.4"
async-trait = "0.1"
bytes = "1"
ahash = "0.8.12"
dashmap = "6.1.0"
ulid = "1"
chrono-tz = "0.10"
rust_decimal = { version = "1.42.0", features = ["db-tokio-postgres"] }
rust_decimal_macros = "1"

# ── WASM-only deps ─────────────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
lol_alloc = "0.4"
gloo-net = { version = "0.6", features = ["http"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

# ── Build deps ─────────────────────────────────────────────────────────────────
[build-dependencies]
tonic-build = "0.14.6"
tonic-prost-build = "0.14.6"
anyhow = "1"

# ── Performance profiles ───────────────────────────────────────────────────────
# Naikkan opt-level dependencies di dev → WASM binary lebih kecil, hydration lebih cepat.
# Kompilasi ulang dependencies-nya sekali saja; subsequent build tetap inkremental.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.bcrypt]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release.package.e-ticketing]
opt-level = "z"
