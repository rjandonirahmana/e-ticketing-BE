# ═══════════════════════════════════════════════════════════════════════════════
# e-ticketing — Satu crate: Backend API (Axum) + Frontend CSR (Leptos)
# ═══════════════════════════════════════════════════════════════════════════════

[package]
name = "e-ticketing"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "e-ticketing"
path = "src/main.rs"

[lib]
name = "e_ticketing"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[package.metadata.leptos]
name = "e-ticketing"
output-name = "e-ticketing"
site-root = "target/site"
site-pkg-dir = "pkg"
# CSS asli app = styles/parts/*.css (digabung build.rs → /styles/app.css).
# File ini cuma stub agar pipeline SASS cargo-leptos punya input valid.
style-file = "styles/leptos.css"
assets-dir = "public"
site-addr = "0.0.0.0:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
lib-features = ["hydrate"]
# Bundle WASM release memakai profil size-opt terpisah; binary server tetap
# full-speed lewat [profile.release] biasa.
lib-profile-release = "wasm-release"

# ── Features ───────────────────────────────────────────────────────────────────
[features]
default = ["ssr"]
ssr = [
    "leptos/ssr",
    "leptos/nonce",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:urlencoding",
]
hydrate = ["leptos/hydrate", "leptos/nonce"]

# ── Shared deps (dikompilasi untuk SEMUA target: native SSR + WASM) ────────────
# ATURAN: jangan taruh dep yang menarik tokio/mio/axum di sini.
# Semua server-only dep ada di [target.'cfg(not(target_arch="wasm32"))'.dependencies]
[dependencies]
# Serialization (dipakai CSR dan SSR)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Konversi serde <-> JsValue di sisi WASM (mis. konfigurasi ICE servers WebRTC)
serde-wasm-bindgen = "0.6"

# Error handling (shared)
thiserror = "2.0.18"
anyhow = "1"
once_cell = "1"
futures = { version = "0.3", features = ["std"] }

# Date/time (wasmbind agar chrono::Utc::now() bekerja di WASM)
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

# Leptos (shared SSR + hydrate)
leptos = { version = "0.8", default-features = false }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false }
leptos_axum = { version = "0.8", optional = true }
urlencoding = { version = "2", optional = true }

# WASM bridge (diperlukan juga saat SSR rlib untuk type compatibility)
send_wrapper = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# Browser APIs — fitur minimal untuk SSR rlib compilation CSR module
# (SSR tidak PAKAI ini, tapi CSR code butuh type defs saat dikompilasi sebagai rlib)
gloo-net = "0.7"
gloo-timers = { version = "0.4", features = ["futures"] }
getrandom = "0.4.3"
qrcodegen = "1.8"
web-sys = { version = "0.3", features = [
     "RtcPeerConnectionIceEvent",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Event",
    "EventTarget",
    "MouseEvent",
    "KeyboardEvent",
    "TouchEvent",
    "TouchList",
    "Touch",
    "PointerEvent",
    "HtmlInputElement",
    "HtmlAnchorElement",
    "FormData",
    "File",
    "FileList",
    "FilePropertyBag",
    "HtmlCanvasElement",
    "HtmlVideoElement",
    "HtmlImageElement",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "TextMetrics",
    "Url",
    "UrlSearchParams",
    "WebSocket",
    "MessageEvent",
    "Blob",
    "Storage",
    "StorageEvent",
    "Navigator",
    "Clipboard",
    "Performance",
    "DomRect",
    "FontFaceSet",
    "AddEventListenerOptions",
    "Request",
    "RequestInit",
    "Response",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MediaTrackConstraints",
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcIceConnectionState",
    "RtcIceGatheringState",
    "RtcSignalingState",
    "RtcTrackEvent",
    "RtcRtpTransceiver",
    "RtcRtpSender",
    "RtcRtpReceiver",
    "RtcRtpEncodingParameters",
    "RtcOfferOptions",
] }

# ── Server-only deps (TIDAK dikompilasi untuk wasm32) ─────────────────────────
# Semua dep yang menarik mio/tokio-net/native TLS ada di sini.
# Saat cargo leptos build WASM (target=wasm32), bagian ini DILEWATI sepenuhnya.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Global allocator untuk server SSR+WebSocket: mengurangi fragmentasi memori
# pada proses berumur panjang (banyak alloc kecil dari serialisasi/SSR/WS).
# Penting di box kecil 2 vCPU / 4 GB. Hanya untuk native (bukan wasm — sisi
# hydrate sudah pakai lol_alloc di lib.rs).
mimalloc = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.18"

# gRPC
tonic = "0.14.6"
prost = "0.14.3"

# Web framework
axum = { version = "0.8.9", features = ["multipart", "ws", "macros"] }
tower = "0.5.3"
tower-http = { version = "0.7", features = ["cors", "trace", "fs", "compression-gzip", "compression-br"] }

# Database
tokio-postgres = { version = "0.7", features = [
    "with-uuid-1",
    "with-chrono-0_4",
    "with-serde_json-1",
] }
postgres-types = { version = "0.2.13", features = ["derive"] }
deadpool-postgres = "0.14.1"
redis = { version = "1.2.1", features = ["tokio-comp", "connection-manager"] }

# Auth / Security
jsonwebtoken = { version = "10.3.0", features = ["use_pem", "rust_crypto"] }
bcrypt = "0.19.1"
uuid = { version = "1", features = ["v4", "serde"] }

# HTTP client (server functions → API internal)
reqwest = { version = "0.13", features = ["json"] }

# Storage & TLS
aws-sdk-s3 = "1.132.0"
rustls = { version = "0.23", features = ["ring"], default-features = false }

# Config / Validation / Logging
dotenvy = "0.15"
config = "0.15.22"
validator = { version = "0.20", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# WebRTC SFU (Sans I/O — pure Rust, no C deps)
str0m = "0.21.0"

# Misc server utils
rand = "0.10.2"
hex = "0.4"
async-trait = "0.1"
bytes = "1.12.0"
ahash = "0.8.12"
dashmap = "6.1.0"
moka = { version = "0.12", features = ["future"] }
ulid = "1"
chrono-tz = "0.10"
rust_decimal = { version = "1.42.1", features = ["db-tokio-postgres"] }
rust_decimal_macros = "1"

# ── WASM-only deps ─────────────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
lol_alloc = "0.4"
gloo-net = { version = "0.7.0", features = ["http"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
# leptos 0.8 → rand 0.9 masih menarik getrandom 0.3 (versi LAMA, terpisah dari
# 0.4 di atas). Tanpa fitur wasm_js pada versi 0.3 ini, build wasm32 gagal:
# "The wasm32-unknown-unknown targets are not supported by default".
# Dep rename ini tidak dipakai langsung — hanya mengaktifkan fitur via unification.
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# ── Build deps ─────────────────────────────────────────────────────────────────
[build-dependencies]
tonic-build = "0.14.6"
tonic-prost-build = "0.14.6"
anyhow = "1"

# ── Performance profiles ───────────────────────────────────────────────────────
# Naikkan opt-level dependencies di dev → WASM binary lebih kecil, hydration lebih cepat.
# Kompilasi ulang dependencies-nya sekali saja; subsequent build tetap inkremental.
[profile.dev]
opt-level = 1
debug = 1          # Kurangi debug symbol (default 2→1): linking 20-30% lebih cepat
incremental = true # Kompilasi inkremental: hanya rekompilasi bagian yang berubah

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.bcrypt]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Profil khusus bundle WASM (dipakai via `lib-profile-release` di metadata
# leptos): optimalkan UKURAN agar download+hydration cepat. JANGAN pakai
# `[profile.release.package.e-ticketing] opt-level="z"` — override per-package
# ikut mengenai BINARY SERVER native, membuat kode terpanas (handler, SQL,
# serialisasi) terkompilasi untuk size alih-alih speed.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
