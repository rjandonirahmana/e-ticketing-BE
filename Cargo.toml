# ═══════════════════════════════════════════════════════════════════════════════
# e-ticketing — Satu crate: Backend API (Axum) + Frontend CSR (Leptos)
# ═══════════════════════════════════════════════════════════════════════════════

[package]
name = "e-ticketing"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "e-ticketing"
path = "src/main.rs"

[lib]
name = "e_ticketing"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[package.metadata.leptos]
name = "e-ticketing"
output-name = "e-ticketing"
site-root = "target/site"
site-pkg-dir = "pkg"
# CSS app ada di DUA tempat, dan keduanya memang dipakai:
#   • styles/parts/*.css → digabung build.rs → di-embed binari → /styles/app.css
#     (seluruh tampilan yang sudah ada, 2.555 kelas).
#   • style/tailwind.css → di-compile cargo-leptos → /pkg/e-ticketing.css
#     (utility Tailwind untuk markup baru).
# Warna keduanya menarik dari token yang sama, lihat blok @theme di
# style/tailwind.css (tak ada tailwind.config.js — Tailwind v4 dikonfigurasi
# lewat CSS).
#
# ⚠️ /pkg/*.css HANYA dihasilkan `cargo leptos build|watch`. `make run`
# (cargo run biasa) tidak membuatnya — halaman tetap bergaya lewat app.css yang
# ter-embed, tetapi utility Tailwind tidak ada. Pakai `make dev` saat menggarap
# markup ber-Tailwind.
tailwind-input-file = "style/tailwind.css"
assets-dir = "public"
site-addr = "0.0.0.0:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
lib-features = ["hydrate"]
# Bundle WASM release memakai profil size-opt terpisah; binary server tetap
# full-speed lewat [profile.release] biasa.
lib-profile-release = "wasm-release"

# ── Pemantau berkas cargo-leptos TIDAK tahu `styles/parts/` ada ───────────────
# CSS aplikasi ini disusun `build.rs` dari `styles/parts/*.css`, dan `build.rs`
# sudah menyatakan `cargo:rerun-if-changed=styles/parts` — jadi `cargo build`
# selalu benar. Tetapi `cargo leptos watch` memutuskan KAPAN membangun lewat
# pemantaunya sendiri, yang hanya melihat sumber Rust, `style-file`, dan
# `assets-dir`. Direktori itu tak satu pun memuat `styles/parts/`.
#
# Akibatnya: mengubah CSS tak menghasilkan apa-apa. Halaman tak berubah, tak ada
# galat, tak ada baris log — dan satu-satunya cara mengetahuinya adalah
# membandingkan mtime berkas CSS dengan mtime binari yang sedang berjalan.
watch-additional-files = ["styles/parts"]

# ── Features ───────────────────────────────────────────────────────────────────
[features]
default = ["ssr"]
ssr = [
    "leptos/ssr",
    "leptos/nonce",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
]
hydrate = ["leptos/hydrate", "leptos/nonce"]

# ── Shared deps (dikompilasi untuk SEMUA target: native SSR + WASM) ────────────
# ATURAN: jangan taruh dep yang menarik tokio/mio/axum di sini.
# Semua server-only dep ada di [target.'cfg(not(target_arch="wasm32"))'.dependencies]
[dependencies]
# Serialization (dipakai CSR dan SSR)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling (shared)
thiserror = "2.0.18"
futures = { version = "0.3", features = ["std"] }

# Date/time (wasmbind agar chrono::Utc::now() bekerja di WASM)
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

# Leptos (shared SSR + hydrate)
leptos = { version = "0.8", default-features = false }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false }
leptos_axum = { version = "0.8", optional = true }
# Penyandian query URL. TIDAK optional dan TIDAK di balik fitur `ssr`: sisi
# klien memakainya juga saat menyusun tautan chat yang membawa judul produk
# (lihat `pages/product_detail.rs`). Nama produk kerap memuat spasi, `&`, dan
# `#` — tanpa penyandian, judul seperti "Kaos A & B" memotong query di `&`.
urlencoding = "2"

# WASM bridge (diperlukan juga saat SSR rlib untuk type compatibility)
send_wrapper = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# Browser APIs — fitur minimal untuk SSR rlib compilation CSR module
# (SSR tidak PAKAI ini, tapi CSR code butuh type defs saat dikompilasi sebagai rlib)
# 0.6, BUKAN 0.7 — sengaja mengikuti versi yang sudah ditarik `leptos_router`
# dan `server_fn`. Cargo tak bisa menyatukan dua versi mayor-berbeda, jadi
# meminta 0.7 berarti DUA salinan penuh klien HTTP ikut masuk ke bundle WASM:
# satu milik kita, satu milik leptos. API yang dipakai di repo ini
# (`Request::get/post`, `.send()`, `.json()`) sama persis di keduanya.
#
# `default-features = false`: bawaannya menyalakan `websocket` dan
# `eventsource` juga, dan repo ini tak memakai keduanya — soket web-nya
# memanggil `web_sys::WebSocket` langsung.
gloo-net = { version = "0.6", default-features = false, features = ["http"] }
gloo-timers = { version = "0.4", features = ["futures"] }
getrandom = "0.4.3"
qrcodegen = "1.8"
web-sys = { version = "0.3", features = [
     "RtcPeerConnectionIceEvent",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Event",
    "EventTarget",
    "MouseEvent",
    "KeyboardEvent",
    "TouchEvent",
    "TouchList",
    "Touch",
    "PointerEvent",
    "HtmlInputElement",
    "HtmlAnchorElement",
    "FormData",
    "File",
    "FileList",
    "FilePropertyBag",
    "HtmlCanvasElement",
    "HtmlVideoElement",
    "HtmlImageElement",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "TextMetrics",
    "Url",
    "UrlSearchParams",
    "WebSocket",
    "MessageEvent",
    "Blob",
    "Storage",
    "StorageEvent",
    "Navigator",
    "Clipboard",
    "Performance",
    "DomRect",
    "FontFaceSet",
    "AddEventListenerOptions",
    # Pratinjau live di kartu `/lives`: hanya kartu yang BENAR-BENAR terlihat
    # yang membuka koneksi WebRTC. Tanpa ini, membuka `/lives` akan menyambung
    # ke setiap siaran dalam daftar sekaligus.
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    # `query_selector_all` mengembalikan NodeList — tanpa fiturnya, metodenya
    # sendiri tidak ada.
    "NodeList",
    "Request",
    "RequestInit",
    "Response",
    # Unggah ber-PERSENTASE. `fetch` tak bisa dipakai untuk ini: ia sama sekali
    # tak melaporkan progres BADAN PERMINTAAN yang naik — satu-satunya API
    # peramban yang melakukannya adalah XMLHttpRequest lewat
    # `xhr.upload.onprogress`. Lihat `web::pages::merchant::upload_merchant_image`.
    "XmlHttpRequest",
    "XmlHttpRequestUpload",
    "XmlHttpRequestEventTarget",
    "ProgressEvent",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MediaTrackConstraints",
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcIceConnectionState",
    "RtcIceGatheringState",
    "RtcSignalingState",
    "RtcTrackEvent",
    "RtcRtpTransceiver",
    "RtcRtpSender",
    "RtcRtpReceiver",
    "RtcRtpEncodingParameters",
    "RtcOfferOptions",
] }

# ── Server-only deps (TIDAK dikompilasi untuk wasm32) ─────────────────────────
# Semua dep yang menarik mio/tokio-net/native TLS ada di sini.
# Saat cargo leptos build WASM (target=wasm32), bagian ini DILEWATI sepenuhnya.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `anyhow` & `once_cell` DIPINDAH KE SINI dari dependensi bersama.
#
# Keduanya nol dipakai di `src/web/` — satu-satunya pohon yang ikut dikompilasi
# ke WASM. Selama tercantum sebagai dependensi bersama, keduanya tetap dibangun
# untuk target wasm32 dan ikut masuk pertimbangan penghapusan kode mati, meski
# tak satu baris pun memanggilnya.
anyhow = "1"
once_cell = "1"

# Ruang disk lewat `statvfs(2)`. `/proc` hanya memuat daftar mount, bukan
# kapasitasnya — kapasitas memang cuma tersedia lewat syscall ini, dan
# memanggil `df` berarti menjalankan proses tiap tombol status ditekan.
libc = "0.2"

# Global allocator untuk server SSR+WebSocket: mengurangi fragmentasi memori
# pada proses berumur panjang (banyak alloc kecil dari serialisasi/SSR/WS).
# Penting di box kecil 2 vCPU / 4 GB. Hanya untuk native (bukan wasm — sisi
# hydrate sudah pakai lol_alloc di lib.rs).
mimalloc = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.18"

# gRPC
tonic = "0.14.6"
prost = "0.14.3"

# Web framework
axum = { version = "0.8.9", features = ["multipart", "ws", "macros"] }
tower = "0.5.3"
tower-http = { version = "0.7", features = ["cors", "trace", "fs", "compression-gzip", "compression-br"] }

# Database
tokio-postgres = { version = "0.7", features = [
    "with-uuid-1",
    "with-chrono-0_4",
    "with-serde_json-1",
] }
postgres-types = { version = "0.2.13", features = ["derive"] }
deadpool-postgres = "0.14.1"
redis = { version = "1.2.1", features = ["tokio-comp", "connection-manager"] }

# Auth / Security
jsonwebtoken = { version = "11", features = ["use_pem", "rust_crypto"] }
bcrypt = "0.19.1"
uuid = { version = "1", features = ["v4", "serde"] }

# HTTP client (server functions → API internal)
reqwest = { version = "0.13", features = ["json"] }

# Storage & TLS
aws-sdk-s3 = "1.132.0"
# Backend kripto: aws_lc_rs, MENGIKUTI apa yang benar-benar dipanggil
# `main.rs` (`rustls::crypto::aws_lc_rs::default_provider()`).
#
# Sebelumnya baris ini menyebut `ring`, dan kodenya tetap ter-compile — bukan
# karena benar, melainkan karena `str0m` (SFU live streaming) menarik
# `str0m-aws-lc-rs`, dan feature Cargo bersifat aditif lintas dependency,
# sehingga `aws_lc_rs` menyala dari sana. Artinya build kita menumpang pada
# pilihan TLS milik crate lain: begitu str0m berpindah backend, build patah
# dengan pesan yang tak menyinggung str0m sama sekali.
#
# Menyebutnya di sini tidak menambah apa pun ke binari (aws-lc-rs sudah ikut
# lewat str0m), hanya membuat ketergantungannya jujur.
rustls = { version = "0.23", features = ["aws_lc_rs"], default-features = false }

# Config / Validation / Logging
dotenvy = "0.15"
config = "0.15.22"
validator = { version = "0.21", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# WebRTC SFU (Sans I/O — pure Rust, no C deps)
str0m = "0.21.0"

# Misc server utils
rand = "0.10.2"
hex = "0.4"
# SHA-256 untuk hash refresh token. Versi ini SUDAH ada di pohon dependency
# lewat crate lain, jadi menambahkannya tidak menambah waktu build.
#
# Sengaja BUKAN bcrypt: refresh token adalah 32 byte acak, bukan kata sandi
# pilihan manusia. Tak ada yang bisa ditebak, jadi hash lambat tak menambah
# keamanan — ia hanya membuat setiap refresh membayar ratusan milidetik.
# Yang dibutuhkan di sini justru hash CEPAT dan deterministik supaya bisa
# dicari lewat index.
sha2 = "0.10"
async-trait = "0.1"
bytes = "1.12.0"
ahash = "0.8.12"
dashmap = "6.1.0"
moka = { version = "0.12", features = ["future"] }
ulid = "3"
chrono-tz = "0.10"
rust_decimal = { version = "1.42.1", features = ["db-tokio-postgres"] }
rust_decimal_macros = "1"

# ── WASM-only deps ─────────────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
lol_alloc = "0.4"
# Versi & fitur WAJIB sama persis dengan deklarasi di [dependencies] di atas.
# Selisih apa pun di sini menghidupkan kembali salinan gandanya.
gloo-net = { version = "0.6", default-features = false, features = ["http"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
# leptos 0.8 → rand 0.9 masih menarik getrandom 0.3 (versi LAMA, terpisah dari
# 0.4 di atas). Tanpa fitur wasm_js pada versi 0.3 ini, build wasm32 gagal:
# "The wasm32-unknown-unknown targets are not supported by default".
# Dep rename ini tidak dipakai langsung — hanya mengaktifkan fitur via unification.
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# ── Build deps ─────────────────────────────────────────────────────────────────
[build-dependencies]
tonic-build = "0.14.6"
tonic-prost-build = "0.14.6"
anyhow = "1"

# ── Performance profiles ───────────────────────────────────────────────────────
# Naikkan opt-level dependencies di dev → WASM binary lebih kecil, hydration lebih cepat.
# Kompilasi ulang dependencies-nya sekali saja; subsequent build tetap inkremental.
[profile.dev]
opt-level = 1
debug = 1          # Kurangi debug symbol (default 2→1): linking 20-30% lebih cepat
incremental = true # Kompilasi inkremental: hanya rekompilasi bagian yang berubah

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.bcrypt]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Profil khusus bundle WASM (dipakai via `lib-profile-release` di metadata
# leptos): optimalkan UKURAN agar download+hydration cepat. JANGAN pakai
# `[profile.release.package.e-ticketing] opt-level="z"` — override per-package
# ikut mengenai BINARY SERVER native, membuat kode terpanas (handler, SQL,
# serialisasi) terkompilasi untuk size alih-alih speed.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
# LTO PENUH, menimpa `lto = "thin"` yang diwarisi dari [profile.release].
#
# Thin-LTO mengoptimalkan tiap unit secara paralel lalu menggabungkannya; fat-LTO
# melebur SELURUH crate jadi satu unit sebelum mengoptimalkan. Untuk bundle WASM
# bedanya besar justru karena pohon dependensinya didominasi kode yang TIDAK
# dipakai (leptos_config menyeret `regex` lengkap dengan tabel Unicode-nya, dan
# itu tak bisa dibuang dari sini — ia dependensi `leptos` sendiri). Hanya dengan
# pandangan menyeluruh, penghapusan kode mati bisa membuktikan kode itu memang
# tak terjangkau. Ongkosnya waktu kompilasi, dan itu hanya dibayar CI.
lto = "fat"
# panic=abort HANYA di sini (bundle WASM): buang kode unwinding/landing-pads →
# .wasm lebih kecil & download lebih cepat. Di WASM panic memang selalu abort,
# jadi nol perubahan perilaku. SENGAJA TIDAK di [profile.release] server: di
# sana panic=abort membuat 1 panic handler mematikan SELURUH proses (hilang
# isolasi panic per-request Axum) → risiko ketersediaan.
panic = "abort"
