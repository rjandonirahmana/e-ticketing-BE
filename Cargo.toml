[package]
name = "e-ticketing"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "e-ticketing"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["multipart"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }

# Database
tokio-postgres = { version = "0.7", features = [
    "with-uuid-1",
    "with-chrono-0_4",
] }
deadpool-postgres = "0.12"
postgres-types = { version = "0.2", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth / Security
jsonwebtoken = "10.3.0"
bcrypt = "0.19.0"
uuid = { version = "1", features = ["v4", "serde"] }

# ULID
ulid = "1"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Env & Config
dotenvy = "0.15"
config = "0.13"

# Validation
validator = { version = "0.20", features = ["derive"] }

# Tracing/Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
rand = "0.10.1"
hex = "0.4"
once_cell = "1"
async-trait = "0.1"
bytes = "1"
