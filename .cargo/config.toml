[env]
MACOSX_DEPLOYMENT_TARGET = "15.0"

# ── Build global ──────────────────────────────────────────────────────────────
[build]
jobs = 10

# ── WASM build flags ──────────────────────────────────────────────────────────
# panic=abort + opt-level=z hanya berlaku untuk wasm32; binary SSR tidak tersentuh.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "opt-level=z", "-C", "panic=abort", "-C", "codegen-units=1"]

# ── Linker cepat untuk macOS arm64 (opsional) ────────────────────────────────
# lld memangkas linking 30-50%. Install: brew install llvm
# Setelah instal, uncomment:
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/opt/llvm/bin/ld64.lld"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "opt-level=3"]
